# The repository-wide gate matrix. The local lefthook jobs are the fast staged
# subset; this workflow owns the full pass over every document, skill, and note.
#
# windows-latest: the skill validator resolves a Windows virtualenv layout
# (.venv/skill-validation/Scripts/python.exe) and the maintenance scripts are
# PowerShell.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Documentation gates
        run: npm run doc-gates
      - name: Skill validation
        shell: pwsh
        run: .\scripts\validate-skills.ps1
      - name: Install media test dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') {
            throw 'FFmpeg archive checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination 'ffmpeg-9.0.2-essentials_build/bin'
          & (Join-Path $bin 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bin 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
      - name: Regression tests
        run: npm test

  posix-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: POSIX installer regression tests
        run: node --test scripts/test-link-skills.mjs
