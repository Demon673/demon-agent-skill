# The repository-wide gate matrix. The local lefthook jobs are the fast staged
# subset; this workflow owns the full pass over every document, skill, and note.
#
# windows-latest: the skill validator resolves a Windows virtualenv layout
# (.venv/skill-validation/Scripts/python.exe) and the maintenance scripts are
# PowerShell.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Documentation gates
        run: npm run doc-gates
      - name: Skill validation
        shell: pwsh
        run: .\scripts\validate-skills.ps1
      - name: Install media test dependencies
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Regression tests
        run: npm test
